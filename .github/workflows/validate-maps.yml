name: Validate custom map registry
on:
  push:
    branches: [main]
    paths:
      - maps.json
      - tools/validate_catalog.py
      - .github/workflows/validate-maps.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_catalog.py
